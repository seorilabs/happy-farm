<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Farm 타이틀 시안</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f1e9;color:#543d26;font-family:'Apple SD Gothic Neo','Arial Rounded MT Bold',sans-serif}.sheet{max-width:1000px;margin:auto;padding:32px 30px 26px}header{margin-bottom:25px;display:flex;align-items:end;justify-content:space-between;gap:16px}h1{font-size:28px;margin:0 0 7px;letter-spacing:-1px}header p{margin:0;color:#8a765c;font-size:14px}.controls{display:flex;gap:7px;flex-wrap:wrap;justify-content:end}.controls select{font:inherit;font-size:13px;border:1px solid #ccb99d;border-radius:8px;padding:7px;background:#fffaf0;color:#684c2c}.options{display:grid;grid-template-columns:1fr 1fr;gap:32px}.caption{display:flex;gap:11px;align-items:center;margin:0 0 12px}.letter{background:#6e4e2c;color:#fff7df;width:31px;height:31px;display:grid;place-items:center;border-radius:9px;font-weight:800;font-size:16px}.caption h2{margin:0;font-size:19px;letter-spacing:-.5px}.caption p{margin:4px 0 0;color:#867459;font-size:12px}.phone{position:relative;height:844px;width:390px;margin:auto;border-radius:24px;overflow:hidden;box-shadow:0 14px 28px #76572c18;background:#f4e7c8;isolation:isolate}.backdrop{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3}.shade{position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,transparent 65%,#f5e8cba8 86%,#f5e8cbeb 100%)}.b .shade{background:linear-gradient(0deg,#f7eccc88,transparent 45%)}.logo{position:absolute;left:5%;right:5%;top:11%;text-align:center}.a .brand{font-size:69px;font-weight:900;letter-spacing:-4px;line-height:1.04;paint-order:stroke fill;-webkit-text-stroke:7px #fff2cd;filter:drop-shadow(0 5px 0 #6f492b)}.a .brand span{display:block}.a .brand span:first-child{color:#609d32}.a .brand span:last-child{color:#ed963d}.tag{display:inline-block;background:#7c512f;color:#ffefca;font-size:11px;font-weight:800;letter-spacing:4px;padding:7px 17px 6px 21px;border-radius:13px;margin-top:18px;box-shadow:0 2px 0 #563a26}.leaves{position:relative;display:block;width:60px;height:29px;margin:0 auto 8px}.leaves:before,.leaves:after{content:'';position:absolute;width:30px;height:18px;background:linear-gradient(140deg,#97cc50,#55a235);border-radius:90% 5% 90% 8%;box-shadow:inset 0 -3px 0 #47862533}.leaves:before{left:4px;top:6px;transform:rotate(65deg)}.leaves:after{right:1px;top:0;transform:rotate(-8deg)}.b .logo{top:14%;left:8%;right:8%;background:linear-gradient(#bb8650,#996537);border:4px solid #d4ab71;border-radius:23px 18px 22px 18px;padding:17px 10px 16px;box-shadow:0 6px 0 #6e4728,inset 0 2px 0 #f0cc9280;transform:rotate(-2deg)}.b .brand{font-size:48px;font-weight:900;letter-spacing:-3px;white-space:nowrap;color:#fff0bf;text-shadow:0 3px 0 #744727,0 -1px 0 #fff9dd}.b .tag{margin-top:5px;letter-spacing:3px;font-size:10px;background:transparent;box-shadow:none;padding:0;color:#f5dba9}.b .leaves{position:absolute;top:-24px;left:calc(50% - 30px);margin:0}.action{position:absolute;bottom:70px;left:34px;right:34px;text-align:center}.status{height:22px;font-size:13px;font-weight:600;color:#5b4b30;margin-bottom:9px;text-shadow:0 1px 0 #fff9e8}.track{height:11px;border-radius:9px;background:#e3d2ac;border:2px solid #fff3d3;box-shadow:0 2px 0 #a7865040;overflow:hidden;margin:0 25px 19px}.fill{height:100%;width:100%;background:linear-gradient(90deg,#70ad32,#a0d257);border-radius:9px}.start{display:block;width:100%;border:2px solid #4e8d28;border-radius:21px;background:linear-gradient(#99d35b,#74b93b);box-shadow:0 5px 0 #49772c,inset 0 2px 0 #c8ed9766;padding:17px 18px 16px;color:#fff8df;text-shadow:0 2px 0 #4d832a;font:800 23px 'Apple SD Gothic Neo','Arial Rounded MT Bold',sans-serif;cursor:pointer;min-height:65px}.start:active{transform:translateY(4px);box-shadow:0 1px 0 #49772c}.start:disabled{background:linear-gradient(#d9cca6,#c2b38d);color:#fffae9;border-color:#ae9e78;box-shadow:0 5px 0 #a2916c;text-shadow:0 1px 0 #aa9871;cursor:default}.footer{position:absolute;bottom:24px;left:20px;right:20px;text-align:center;font-size:10px;letter-spacing:2px;color:#806649;font-weight:600}.review-note{margin-top:24px;font-size:12px;line-height:1.65;color:#8a765b}.loading .fill{width:50%}.error .fill{width:50%;background:#c59b61}.error .status{color:#814c2b}.error .start{background:linear-gradient(#c79863,#ab7849);border-color:#966139;box-shadow:0 5px 0 #775031;text-shadow:0 2px 0 #80522f}.en .a .brand{font-size:69px;letter-spacing:-2px}.en .b .brand{font-size:47px;letter-spacing:-2px}.small .phone{width:320px;height:568px}.small .logo{top:7%}.small .a .brand{font-size:52px}.small .b .logo{top:10%}.small .b .brand{font-size:38px}.small .tag{margin-top:10px}.small .action{left:24px;right:24px;bottom:42px}.small .start{min-height:55px;font-size:21px;padding:13px}.small .track{margin-bottom:13px}.small .footer{bottom:15px;font-size:9px}.large .phone{width:390px;height:844px}.text-large .status{font-size:18px}.text-large .start{font-size:30px;min-height:74px}.single .sheet{padding:0;max-width:none}.single header,.single .caption,.single .review-note{display:none}.single .options{display:block}.single article:not(.selected){display:none}.single .phone{width:100vw;height:100vh;border-radius:0;box-shadow:none}.single .logo{top:11%}.single .small .logo{top:7%}@media(max-width:850px){.options{grid-template-columns:1fr}header{align-items:start;flex-direction:column}.phone{max-width:100%}.sheet{padding:24px 18px}}
</style>
<main class="sheet">
<header><div><h1>타이틀 화면, 두 가지 방향</h1><p>현재 클레이 아트 · Warm Wood 색감 · 로고 → 농장 → 시작</p></div><div class="controls"><select id="locale" aria-label="언어"><option value="ko">한국어</option><option value="en">English</option></select><select id="state" aria-label="상태"><option value="ready">준비 완료</option><option value="loading">준비 중</option><option value="error">읽기 오류</option></select><select id="size" aria-label="크기"><option value="large">390 × 844</option><option value="small">320 × 568</option></select></div></header>
<div class="options">
<article class="a" data-direction="a"><div class="caption"><span class="letter">A</span><div><h2>아침 농장</h2><p>넓은 풍경 · 입체 글자 · 밝고 풍성한 시작</p></div></div><div class="phone"><img class="backdrop" src="background-a.png" alt="클레이 농장의 아침 풍경"><div class="shade"></div><div class="logo"><i class="leaves"></i><div class="brand"><span>행복</span><span>농장</span></div><div class="tag">TYCOON</div></div><div class="action"><div class="status" aria-live="polite">농장 준비 완료</div><div class="track" role="progressbar" aria-label="준비 단계" aria-valuemax="2" aria-valuenow="2"><div class="fill"></div></div><button class="start">농장으로 가기</button></div><div class="footer">SEORI LABS</div></div></article>
<article class="b" data-direction="b"><div class="caption"><span class="letter">B</span><div><h2>작은 농장</h2><p>중앙 디오라마 · 나무 간판 · 차분한 장난감 느낌</p></div></div><div class="phone"><img class="backdrop" src="background-b.png" alt="크림 배경의 클레이 농장 디오라마"><div class="shade"></div><div class="logo"><i class="leaves"></i><div class="brand">행복 농장</div><div class="tag">TYCOON</div></div><div class="action"><div class="status" aria-live="polite">농장 준비 완료</div><div class="track" role="progressbar" aria-label="준비 단계" aria-valuemax="2" aria-valuenow="2"><div class="fill"></div></div><button class="start">농장으로 가기</button></div><div class="footer">SEORI LABS</div></div></article>
</div><p class="review-note">디자인 시안입니다. 준비 중·오류는 표시 확인용이며 실제 저장 읽기와 연결되지 않았습니다.<br>제어 항목은 시안 검수용입니다. 제품 화면에는 포함하지 않습니다.</p>
</main>
<script>
const params=new URLSearchParams(location.search);const copy={ko:{a:['행복','농장'],b:'행복 농장',ready:'농장 준비 완료',loading:'저장한 농장을 읽고 있어요',error:'농장을 읽지 못했어요',start:'농장으로 가기',wait:'준비 중',retry:'다시 시도'},en:{a:['Happy','Farm'],b:'Happy Farm',ready:'Your farm is ready',loading:'Reading your saved farm',error:'Could not read your farm',start:'Enter Farm',wait:'Preparing',retry:'Try Again'}};for(const name of ['locale','state','size']){if(params.has(name))document.getElementById(name).value=params.get(name)};if(params.has('direction')){document.body.classList.add('single');document.querySelector(`[data-direction="${params.get('direction')}"]`).classList.add('selected')};if(params.get('text')==='large')document.body.classList.add('text-large');function refresh(){const locale=document.getElementById('locale').value;const state=document.getElementById('state').value;const size=document.getElementById('size').value;document.body.classList.remove('en','ko','ready','loading','error','large','small');document.body.classList.add(locale,state,size);document.documentElement.lang=locale;const m=copy[locale];document.querySelector('.a .brand').innerHTML=m.a.map(s=>`<span>${s}</span>`).join('');document.querySelector('.b .brand').textContent=m.b;document.querySelectorAll('.status').forEach(el=>el.textContent=m[state]);document.querySelectorAll('.start').forEach(el=>{el.textContent=state==='ready'?m.start:state==='loading'?m.wait:m.retry;el.disabled=state==='loading'});document.querySelectorAll('[role="progressbar"]').forEach(el=>el.setAttribute('aria-valuenow',state==='ready'?'2':'1'))};document.querySelectorAll('select').forEach(el=>el.addEventListener('change',refresh));refresh();
</script>
</html>

substitutions:
  _SEORI_RELEASE_TAG: "v1.10.2"
  _SEORI_RELEASE_SOURCE_SHA: "0000000000000000000000000000000000000000"
  _ANDROID_VERSION_NAME: "1.10.2"
  _ANDROID_VERSION_CODE: "1001010002"
  _GOOGLE_PLAY_UPLOAD_KEY_ALIAS: "happy-farm-upload"
  _ARTIFACT_BUCKET: "gs://seorilabs-ci-build-artifacts/seorilabs/happy-farm/manual"

steps:
  - id: build-signed-aab
    name: asia-northeast3-docker.pkg.dev/seorilabs-ci/builders/rn-android-builder:node24-jdk17-android36
    entrypoint: bash
    args:
      - scripts/build-android.sh
    env:
      - SEORI_RELEASE_TAG=${_SEORI_RELEASE_TAG}
      - SEORI_RELEASE_VERSION=${_ANDROID_VERSION_NAME}
      - SEORI_RELEASE_VERSION_CODE=${_ANDROID_VERSION_CODE}
      - SEORI_RELEASE_SOURCE_SHA=${_SEORI_RELEASE_SOURCE_SHA}
      - ANDROID_VERSION_NAME=${_ANDROID_VERSION_NAME}
      - ANDROID_VERSION_CODE=${_ANDROID_VERSION_CODE}
      - GOOGLE_PLAY_UPLOAD_KEY_ALIAS=${_GOOGLE_PLAY_UPLOAD_KEY_ALIAS}
    secretEnv:
      - FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64
      - GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64
      - GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD
      - GOOGLE_PLAY_UPLOAD_KEY_PASSWORD

availableSecrets:
  secretManager:
    - versionName: projects/seorilabs-ci/secrets/happy-farm-firebase-google-services/versions/latest
      env: FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64
    - versionName: projects/seorilabs-ci/secrets/happy-farm-play-keystore/versions/latest
      env: GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64
    - versionName: projects/seorilabs-ci/secrets/happy-farm-play-keystore-password/versions/latest
      env: GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD
    - versionName: projects/seorilabs-ci/secrets/happy-farm-play-key-password/versions/latest
      env: GOOGLE_PLAY_UPLOAD_KEY_PASSWORD

artifacts:
  objects:
    location: ${_ARTIFACT_BUCKET}
    paths:
      - dist/android/happy-farm.aab

options:
  machineType: E2_STANDARD_2
  logging: CLOUD_LOGGING_ONLY

timeout: 7200s

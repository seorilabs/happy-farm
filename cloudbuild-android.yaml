# Android 서명 AAB 를 굽는 Cloud Build 설정. 2026-09-19 부터 평시 경로가 아니다.
#
# 저장소가 public 이 된 뒤 릴리즈 빌드는 GitHub Actions 로 옮겼다(#549).
# deploy-google-play.yml -> 중앙 rn-deploy-google-play.yml(ubuntu-latest) 이 정본이고,
# 같은 빌드가 Cloud Build 34분에서 13분으로 줄었으며 과금도 없다.
#
# 그런데도 이 파일을 지우지 않는다. GitHub Actions 로 갈 수 없게 되는 상황(무료 분량
# 소진, hosted 러너 장애, 정책 변경)에서 되돌아올 경로이기 때문이다. 실제로 2026-09-19
# 하루에만 ARC public 차단과 릴리즈 원장 결함으로 배포 경로가 두 번 막혔다.
#
# 짝이 되는 실행부는 scripts/build-android.sh 의 market-upload 모드다. 둘은 함께
# 유지하거나 함께 지운다. 한쪽만 지우면 폴백이 성립하지 않는다.
#
# 자격증명은 Secret Manager 가 아니라 일회성 GCS 객체로 들어온다. 평시 경로가 아니므로
# 워크플로가 올려주지 않는다. 되돌릴 때 사람이 로컬 카탈로그에서 직접 올린다.
# 로컬 원본이 source of truth 이고 ~/.config/seorilabs 아래에 있다.
#
# 되돌리는 방법:
#   B="gs://seorilabs-ci-build-credentials/seorilabs/happy-farm/manual-$(date +%s)"
#   C="$HOME/.config/seorilabs"
#   D="$(mktemp -d)"; umask 077
#   base64 -i "$C/firebase/happy-farm-google-services.json" | tr -d '\n' > "$D/firebase-android-config.b64"
#   base64 -i "$C/play-store/happy-farm-upload.jks"          | tr -d '\n' > "$D/play-keystore.b64"
#   grep '^storePassword=' "$C/play-store/happy-farm-keystore.properties" | cut -d= -f2- | tr -d '\n' > "$D/play-keystore-password"
#   grep '^keyPassword='   "$C/play-store/happy-farm-keystore.properties" | cut -d= -f2- | tr -d '\n' > "$D/play-key-password"
#   for f in "$D"/*; do gcloud storage cp "$f" "$B/$(basename "$f")"; done
#   gcloud builds submit . --project=seorilabs-ci --region=global \
#     --config=cloudbuild-android.yaml --ignore-file=.gcloudignore \
#     --substitutions="_SEORI_RELEASE_TAG=v1.11.6,_SEORI_RELEASE_SOURCE_SHA=$(git rev-parse HEAD),_ANDROID_VERSION_NAME=1.11.6,_ANDROID_VERSION_CODE=...,_CREDENTIAL_BUCKET=$B"
#   rm -rf "$D"
#   _SEORI_RELEASE_SOURCE_SHA 는 제출하는 트리의 40자리 커밋 SHA 다. 스크립트가 0 으로 채운
#   placeholder 를 거부한다. 네 값 모두 기본값이 비어 있어 빠뜨리면 빌드 전에 멈춘다.
#   그 뒤 _ARTIFACT_BUCKET 에서 AAB 를 받아 업로드한다. 빌드가 prefix 를 지우지만
#   버킷 수명주기 1일이 백스톱이라 실패해도 하루 뒤 사라진다.

substitutions:
  # 릴리즈마다 달라지는 네 값은 기본값을 비운다. 옛 값(v1.10.2)이 남아 있으면 틀린 버전으로
  # 조용히 빌드될 수 있다. 비어 있으면 스크립트가 필수값 검사에서 멈춘다.
  _SEORI_RELEASE_TAG: ""
  _SEORI_RELEASE_SOURCE_SHA: ""
  _ANDROID_VERSION_NAME: ""
  _ANDROID_VERSION_CODE: ""
  _GOOGLE_PLAY_UPLOAD_KEY_ALIAS: "happy-farm-upload"
  _ARTIFACT_BUCKET: "gs://seorilabs-ci-build-artifacts/seorilabs/happy-farm/manual"
  _CREDENTIAL_BUCKET: ""

steps:
  # rm 에 `|| true` 를 붙이지 않는다. prefix 는 제출 직전에 사람이 만든 것이라 반드시
  # 존재하고, 삭제 실패는 키스토어가 GCS 에 남았다는 뜻이다. 빌드 맨 앞 단계라
  # 세워도 긴 AAB 빌드를 낭비하지 않는다.
  - id: fetch-ephemeral-credentials
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        install -d -m 0700 /workspace/.ci-secrets
        for name in \
          firebase-android-config.b64 \
          play-keystore.b64 \
          play-keystore-password \
          play-key-password; do
          gcloud storage cp "${_CREDENTIAL_BUCKET}/$$name" "/workspace/.ci-secrets/$$name"
          chmod 0600 "/workspace/.ci-secrets/$$name"
        done
        gcloud storage rm --recursive "${_CREDENTIAL_BUCKET}"

  # builder 이미지는 US 사본을 쓴다. 이 빌드는 default pool 에서 도는데 default
  # pool 은 미국에서 실행된다. 서울 사본을 당기면 빌드마다 2GB 가 대륙을 건너
  # egress 로 붙는다(9/18~19 릴리스 5건에 10.3GiB, 1,145원).
  - id: build-signed-aab
    name: us-docker.pkg.dev/seorilabs-ci/builders/rn-android-builder:node24-jdk17-android36
    entrypoint: bash
    # pnpm store 디렉터리를 먼저 만든다. market-upload 는 build.env 의 CLOUD_BUILD_PNPM_STORE 가
    # 없으면 멈추는데, #549 이전에는 배포 워크플로가 제출 직전에
    # `pnpm store add @seorilabs/platform-sdk` 로 채웠다. platform-sdk 가 비공개였던 시절의
    # 흔적이다. #549 가 평시 경로를 중앙 워크플로로 옮기며 그 단계를 지웠고 이 폴백만 남았다.
    # 지금은 공개 npm 패키지이고 스크립트의 pnpm install 이 --offline 이 아니라, 빈 디렉터리면
    # 레지스트리에서 받아 채운다.
    args:
      - -c
      - |
        set -euo pipefail
        store="$$(grep '^CLOUD_BUILD_PNPM_STORE=' build.env | cut -d= -f2-)"
        [ -n "$$store" ]
        mkdir -p "/workspace/$$store"
        exec bash scripts/build-android.sh
    env:
      - SEORI_RELEASE_TAG=${_SEORI_RELEASE_TAG}
      - SEORI_RELEASE_VERSION=${_ANDROID_VERSION_NAME}
      - SEORI_RELEASE_VERSION_CODE=${_ANDROID_VERSION_CODE}
      - SEORI_RELEASE_SOURCE_SHA=${_SEORI_RELEASE_SOURCE_SHA}
      - ANDROID_VERSION_NAME=${_ANDROID_VERSION_NAME}
      - ANDROID_VERSION_CODE=${_ANDROID_VERSION_CODE}
      - GOOGLE_PLAY_UPLOAD_KEY_ALIAS=${_GOOGLE_PLAY_UPLOAD_KEY_ALIAS}
      - BUILD_CREDENTIAL_DIR=/workspace/.ci-secrets

artifacts:
  objects:
    location: ${_ARTIFACT_BUCKET}
    paths:
      - dist/android/happy-farm.aab

options:
  # machineType 은 지정하지 않는다.
  #
  # 여기에 E2_STANDARD_2 가 적혀 있었고 CI 가 제출 단계에서 죽었다.
  #   ERROR: ... as build config: .options.machineType: unused
  # gcloud 는 build config 를 클라이언트에 번들된 스키마로 파싱하고,
  # 모르는 enum 값을 만나면 그 필드를 unrecognized 로 떨어뜨린 뒤 이 메시지를
  # 낸다. E2_STANDARD_2 는 비교적 최근 추가된 값이라, CI 에 설치된 gcloud 가
  # 그보다 오래되면 값이 유효한데도 거부된다. 값을 적어두는 한 빌드가 러너
  # 이미지의 gcloud 버전에 묶인다.
  #
  # 공식 문서 기준 "The default machine type is e2-standard-2 with 2 CPUs" 라,
  # 비워두면 E2_STANDARD_2 와 같은 사양이면서 gcloud 버전에 영향받지 않는다.
  # 무료 한도 대상으로 내린 ffa5e40 의 의도도 그대로 유지된다.
  logging: CLOUD_LOGGING_ONLY

timeout: 7200s

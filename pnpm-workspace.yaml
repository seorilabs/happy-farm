packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@firebase/util': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  protobufjs: true
  react-native-nitro-modules: true

# 조직이 직접 발행하고 exact version으로 고정한 private SDK는 발행 직후 연동한다.
# 그 외 의존성에는 pnpm의 신규 릴리스 대기 정책을 그대로 적용한다.
minimumReleaseAgeExclude:
  - '@seorilabs/platform-sdk'

# Upstream build tools still pin vulnerable transitive releases. Keep each
# replacement exact so the lockfile records the reviewed security boundary.
overrides:
  '@fastify/middie': 9.3.2
  'brace-expansion@<2': 1.1.18
  'brace-expansion@>=2 <3': 2.1.4
  'brace-expansion@>=4': 5.0.9
  'fast-uri@<3': 2.4.4
  'fast-uri@>=3': 3.1.5
  fastify: 5.8.5
  find-my-way: 9.7.0
  image-size: 'workspace:@happy-farm/image-size-compat@*'
  ip: 'workspace:@happy-farm/ip-compat@*'
  'js-yaml@<4': 3.15.1
  'js-yaml@>=4': 4.3.1
  nanoid: 3.3.18
  shell-quote: 1.9.0
  websocket-driver: 0.7.5

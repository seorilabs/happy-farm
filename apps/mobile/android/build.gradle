buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
        googleMobileAdsVersion = "25.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.4")
        classpath("com.google.firebase:firebase-crashlytics-gradle:3.0.7")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (
                details.requested.group == "com.google.android.gms" &&
                details.requested.name in ["play-services-ads", "play-services-ads-api"]
            ) {
                details.useVersion rootProject.ext.googleMobileAdsVersion
                details.because("Use the latest stable Google Mobile Ads SDK for Android 15 edge-to-edge compatibility warnings.")
            }
        }
    }
}

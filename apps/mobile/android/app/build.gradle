apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

import org.gradle.api.tasks.PathSensitivity
import java.util.Locale

def googleServicesConfigFile = file("google-services.json")
if (googleServicesConfigFile.exists()) {
    apply plugin: "com.google.gms.google-services"
    apply plugin: "com.google.firebase.crashlytics"
} else {
    logger.lifecycle("Skipping Firebase Android Gradle plugins because ${googleServicesConfigFile} is missing.")
}

def resolveNodePackageJson = { String expression ->
    def process = new ProcessBuilder("node", "--print", expression)
        .directory(rootDir.parentFile)
        .redirectErrorStream(true)
        .start()
    def output = process.inputStream.text.trim()
    if (process.waitFor() != 0) {
        throw new GradleException("Failed to resolve Node package: ${output}")
    }
    return output
}

def hermesCompilerPackageJson = resolveNodePackageJson("require.resolve('hermes-compiler/package.json', { paths: [require.resolve('react-native/package.json')] })")
def hermesCompilerDir = new File(hermesCompilerPackageJson).parentFile
def hermesOsBin = System.getProperty("os.name").toLowerCase().contains("mac") ? "osx-bin" : System.getProperty("os.name").toLowerCase().contains("windows") ? "win64-bin" : "linux64-bin"
def uploadKeyPropertiesFile = rootProject.file("key.properties")
def uploadKeyProperties = new Properties()
if (uploadKeyPropertiesFile.exists()) {
    uploadKeyPropertiesFile.withInputStream { uploadKeyProperties.load(it) }
}
def releaseSigningTaskPattern = ~/^(assemblerelease|bundlerelease|packagerelease|packagereleasebundle|signrelease|signreleasebundle|installrelease|validatesigningrelease)$/
def taskRequiresUploadKeyProperties = { String taskName ->
    taskName.toLowerCase(Locale.ROOT) ==~ releaseSigningTaskPattern
}
def requiresUploadKeyProperties = gradle.startParameter.taskNames.any { taskPath ->
    def segments = taskPath.tokenize(':')
    if (segments.size() >= 2 && segments[-2] != project.name) return false
    return taskRequiresUploadKeyProperties(segments.last())
}
def requiredUploadKeyPropertyNames = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
def hasCompleteUploadKeyProperties = {
    uploadKeyPropertiesFile.exists() && requiredUploadKeyPropertyNames.every { key ->
        uploadKeyProperties[key]?.toString()?.trim()
    }
}
def requireUploadKeyPropertiesFile = {
    if (!uploadKeyPropertiesFile.exists()) {
        throw new GradleException("Missing ${uploadKeyPropertiesFile}. Create it from the upload keystore before building release.")
    }
}
def requireUploadKeyProperty = { String key ->
    def value = uploadKeyProperties[key]?.toString()?.trim()
    if (!value) {
        throw new GradleException("key.properties missing ${key}. Create it from the upload keystore before building release.")
    }
    return value
}
def resolveUploadStoreFile = { String storeFilePath ->
    def candidate = new File(storeFilePath)
    return candidate.isAbsolute() ? candidate : new File(rootProject.projectDir, storeFilePath)
}
def resolveVersionCode = { int defaultValue ->
    def rawValue = (project.findProperty("versionCodeOverride") ?: System.getenv("GOOGLE_PLAY_VERSION_CODE") ?: defaultValue.toString()).toString()
    if (!(rawValue ==~ /[0-9]+/)) {
        throw new GradleException("versionCode must be a positive integer, got: ${rawValue}")
    }
    def parsedValue = rawValue.toInteger()
    if (parsedValue <= 0 || parsedValue > 2100000000) {
        throw new GradleException("versionCode must be between 1 and 2100000000, got: ${parsedValue}")
    }
    return parsedValue
}
def resolveVersionName = { String defaultValue ->
    def rawValue = (project.findProperty("versionNameOverride") ?: System.getenv("RELEASE_VERSION_NAME") ?: System.getenv("GOOGLE_PLAY_VERSION_NAME") ?: defaultValue).toString()
    if (!(rawValue ==~ /(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)/)) {
        throw new GradleException("versionName must be a SemVer-compatible numeric core, got: ${rawValue}")
    }
    return rawValue
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    hermesCommand = new File(hermesCompilerDir, "hermesc/${hermesOsBin}/hermesc").absolutePath
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

def sharedJsBundleInputs = [
    "farmCoreSrc": file("$rootDir/../../../packages/farm-core/src"),
    "farmUiSrc": file("$rootDir/../../../packages/farm-ui/src"),
    "mobileApp": file("$rootDir/../App.tsx"),
    "mobileIndex": file("$rootDir/../index.js"),
    "mobileMetroConfig": file("$rootDir/../metro.config.js"),
    "mobilePackageJson": file("$rootDir/../package.json"),
    "workspacePackageJson": file("$rootDir/../../../package.json"),
    "workspacePnpmLock": file("$rootDir/../../../pnpm-lock.yaml"),
]

afterEvaluate {
    tasks.matching { task ->
        task.name.startsWith("createBundle") && task.name.endsWith("JsAndAssets")
    }.configureEach { task ->
        sharedJsBundleInputs.each { inputName, inputPath ->
            if (inputPath.isDirectory()) {
                task.inputs.dir(inputPath)
                    .withPathSensitivity(PathSensitivity.RELATIVE)
                    .withPropertyName("happyFarmSharedJs.${inputName}")
            } else if (inputPath.exists()) {
                task.inputs.file(inputPath)
                    .withPathSensitivity(PathSensitivity.RELATIVE)
                    .withPropertyName("happyFarmSharedJs.${inputName}")
            }
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    if (taskGraph.allTasks.any { it.project == project && taskRequiresUploadKeyProperties(it.name) }) {
        requireUploadKeyPropertiesFile()
        requiredUploadKeyPropertyNames.each { requireUploadKeyProperty(it) }
    }
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.seorilabs.happyfarm"
    defaultConfig {
        applicationId "com.seorilabs.happyfarm"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolveVersionCode(2)
        versionName resolveVersionName("1.0.1")
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (requiresUploadKeyProperties) {
                requireUploadKeyPropertiesFile()
            }
            if (requiresUploadKeyProperties || hasCompleteUploadKeyProperties()) {
                storeFile resolveUploadStoreFile(requireUploadKeyProperty("storeFile"))
                storePassword requireUploadKeyProperty("storePassword")
                keyAlias requireUploadKeyProperty("keyAlias")
                keyPassword requireUploadKeyProperty("keyPassword")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

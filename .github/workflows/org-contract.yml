name: Org Contract
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
  packages: read
concurrency:
  group: org-contract-${{ github.repository_id }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  org-contract:

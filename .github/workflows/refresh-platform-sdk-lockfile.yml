name: Refresh Platform SDK Lockfile

on:
  push:
    branches:
      - feature/platform-event-sink
    paths:
      - apps/ait/package.json
      - apps/mobile/package.json
      - .github/workflows/refresh-platform-sdk-lockfile.yml

permissions:
  contents: write
  packages: read

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    name: Authenticated package lock refresh
    runs-on: seorilabs-rpi-arm64
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node and GitHub Packages
        uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          check-latest: false
          registry-url: https://npm.pkg.github.com
          scope: '@seorilabs'

      - name: Refresh lockfile
        run: pnpm install --lockfile-only
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Platform SDK lockfile 갱신" -m "- private GitHub Package 0.1.0 해시 반영"
          git push origin "HEAD:${GITHUB_REF_NAME}"

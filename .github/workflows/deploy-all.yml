name: Deploy All

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "모든 마켓에 공통으로 고정할 릴리즈 태그입니다. 비우면 중앙 resolver가 최신 stable vX.Y.Z 하나를 고릅니다."
        required: false
        type: string
      deploy_ait:
        description: "AIT(Apps in Toss) 배포 포함"
        required: false
        default: true
        type: boolean
      deploy_google_play:
        description: "Google Play 배포 포함"
        required: false
        default: true
        type: boolean
      memo:
        description: "AIT 배포 메모입니다. 비우면 릴리즈 태그와 커밋이 자동으로 들어갑니다."
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  packages: read

concurrency:
  group: happy-farm-deploy-all-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Bind exact release tag
    uses: seorilabs/.github/.github/workflows/resolve-release-version.yml@main
    with:
      release_tag: ${{ inputs.release_tag }}

  ait:
    name: Deploy AIT
    needs: resolve
    if: ${{ inputs.deploy_ait }}
    uses: ./.github/workflows/deploy-apps-in-toss.yml
    secrets:
      APPS_IN_TOSS_API_KEY: ${{ secrets.APPS_IN_TOSS_API_KEY }}
    with:
      release_tag: ${{ needs.resolve.outputs.tag }}
      memo: ${{ inputs.memo }}

  google-play:
    name: Deploy Google Play
    needs: resolve
    if: ${{ inputs.deploy_google_play }}
    uses: ./.github/workflows/deploy-google-play.yml
    with:
      release_tag: ${{ needs.resolve.outputs.tag }}
      send_to_google_play: true
      after_upload: "내부 테스터에게 배포하기"

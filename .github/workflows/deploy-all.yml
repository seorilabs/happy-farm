name: Deploy All

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "배포할 릴리즈 태그입니다. 비우면 각 배포가 최신 vX.Y.Z 태그를 사용합니다. 예: v1.1.0"
        required: false
        type: string
      deploy_ait:
        description: "AIT(Apps in Toss) 배포 포함"
        required: false
        default: true
        type: boolean
      deploy_google_play:
        description: "Google Play 배포 포함"
        required: false
        default: true
        type: boolean
      deploy_app_store:
        description: "App Store 배포 포함"
        required: false
        default: true
        type: boolean
      memo:
        description: "AIT 배포 메모입니다. 비우면 릴리즈 태그와 커밋이 자동으로 들어갑니다."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: happy-farm-deploy-all-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release tag
    runs-on: seorilabs-rpi-arm64
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ]; then
            tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            if [ -z "$tag" ]; then
              echo "release_tag가 비어 있고 vX.Y.Z 태그도 없습니다." >&2
              exit 1
            fi
            echo "release_tag가 비어 있어 최신 태그 $tag 를 사용합니다."
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  ait:
    name: Deploy AIT
    needs: resolve
    if: ${{ inputs.deploy_ait }}
    uses: ./.github/workflows/deploy-apps-in-toss.yml
    secrets: inherit
    with:
      release_tag: ${{ needs.resolve.outputs.tag }}
      memo: ${{ inputs.memo }}

  google-play:
    name: Deploy Google Play
    needs: resolve
    if: ${{ inputs.deploy_google_play }}
    uses: ./.github/workflows/deploy-google-play.yml
    secrets: inherit
    with:
      release_tag: ${{ needs.resolve.outputs.tag }}
      send_to_google_play: true
      after_upload: "내부 테스터에게 배포하기"

  app-store:
    name: Deploy App Store
    needs: resolve
    if: ${{ inputs.deploy_app_store }}
    uses: ./.github/workflows/deploy-app-store.yml
    secrets: inherit
    with:
      release_tag: ${{ needs.resolve.outputs.tag }}
      upload_to_app_store: true

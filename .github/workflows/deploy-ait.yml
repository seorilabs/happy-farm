name: Deploy AppsInToss

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      memo:
        description: '앱인토스 배포 메모 (선택, 최대 1000자)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: happy-farm-apps-in-toss-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: AIT artifact deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: apps-in-toss

    env:
      APPS_IN_TOSS_API_KEY: ${{ secrets.APPS_IN_TOSS_API_KEY }}
      APPS_IN_TOSS_INPUT_MEMO: ${{ github.event_name == 'workflow_dispatch' && inputs.memo || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check required config
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$APPS_IN_TOSS_API_KEY" ]; then
            echo "APPS_IN_TOSS_API_KEY secret is required." >&2
            exit 1
          fi

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup-pnpm-workspace

      - name: Resolve release version
        id: release-version
        run: node scripts/resolve-release-version.mjs --github-output --github-step-summary --write-release-info --quiet

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build AIT artifact
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: happy-farm-ait-v${{ steps.release-version.outputs.version_name }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: 'apps/ait/*.ait'

      - name: Deploy to Apps in Toss
        shell: bash
        env:
          RELEASE_VERSION_NAME: ${{ steps.release-version.outputs.version_name }}
        run: |
          set -euo pipefail

          memo="$APPS_IN_TOSS_INPUT_MEMO"

          if [ -z "$memo" ]; then
            memo="v${RELEASE_VERSION_NAME} GitHub Actions ${GITHUB_REF_NAME}@${GITHUB_SHA::7}"
          else
            memo="v${RELEASE_VERSION_NAME} ${memo}"
          fi

          pnpm deploy -- --api-key "$APPS_IN_TOSS_API_KEY" --memo "$memo"

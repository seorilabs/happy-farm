# WorkflowBundle v5 generator가 관리합니다. 수동 편집하지 마십시오.
name: Android Build-only
on:
  pull_request:
    paths:
      - .github/workflows/android-build-only.yml
permissions:
  contents: read
  id-token: write
  packages: read
concurrency:
  group: android-build-${{ github.repository_id }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android-build:
    uses: seorilabs/.github/.github/workflows/rn-build-android-cloud-v2.yml@6dfa595c8a6b0dfb55bfab1277bda56327f602fb

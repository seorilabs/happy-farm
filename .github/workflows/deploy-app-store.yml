# App Store archive·upload은 Xcode Cloud에서만 실행한다. 이 워크플로는 태그를 Xcode Cloud
# 빌드로 넘기는 조직 재사용 워크플로를 부르기만 한다. 트리거 구현과 테스트는 중앙에 한 벌만
# 둔다(seorilabs/.github scripts/trigger-xcode-cloud.mjs).
#
# bundle id는 app-store/app-store.config.json에서 읽는다. 여기에 적지 않는다.
name: Deploy App Store

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Xcode Cloud에서 빌드할 릴리즈 태그(vX.Y.Z)"
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: "Xcode Cloud에서 빌드할 릴리즈 태그(vX.Y.Z)"
        required: true
        type: string
    secrets:
      APP_STORE_CONNECT_API_KEY_ID:
        required: true
      APP_STORE_CONNECT_ISSUER_ID:
        required: true
      APP_STORE_CONNECT_PRIVATE_KEY_BASE64:
        required: true

permissions:
  contents: read

concurrency:
  group: happy-farm-xcode-cloud-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  app-store:
    uses: seorilabs/.github/.github/workflows/app-store-xcode-cloud.yml@9c6f2df3133cbdf97b83792f79d92a920a27380b
    with:
      release_tag: ${{ inputs.release_tag }}
    secrets:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}

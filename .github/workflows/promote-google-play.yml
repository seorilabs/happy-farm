name: Promote Google Play

# 내부 트랙 최신 빌드를 재빌드 없이 프로덕션으로 승격(= 심사 제출). 출시노트는 태그 시점에
# Backoffice 가 생성한 release-notes.json 을 언어별로 반영한다. Backoffice/Telegram 이 dispatch.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '승격할 릴리즈 태그 (예: v1.1.0). 비우면 최신 vX.Y.Z.'
        required: false
        type: string
      from_track:
        description: '승격 원본 트랙'
        required: false
        default: internal
        type: string
      to_track:
        description: '승격 대상 트랙'
        required: false
        default: production
        type: string
      release_status:
        description: '완전 출시=completed. rollout 지정 시 스크립트가 inProgress 로 전환.'
        required: false
        default: completed
        type: string
      rollout:
        description: '단계적 출시 비율(0,1]. 비우면 완전 출시.'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
      from_track:
        required: false
        default: internal
        type: string
      to_track:
        required: false
        default: production
        type: string
      release_status:
        required: false
        default: completed
        type: string
      rollout:
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: happy-farm-google-play-promote-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  promote:
    uses: seorilabs/.github/.github/workflows/promote-google-play.yml@main
    secrets: inherit
    with:
      release_tag: ${{ inputs.release_tag }}
      from_track: ${{ inputs.from_track }}
      to_track: ${{ inputs.to_track }}
      release_status: ${{ inputs.release_status }}
      rollout: ${{ inputs.rollout }}
      upload_script: scripts/upload-google-play-internal.py

name: Create Release Tag

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: '태그를 붙일 ref 또는 commit SHA. 비우면 main.'
        required: false
        default: main
        type: string
      bump:
        description: '직접 태그를 지정하지 않을 때의 증가 방식'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      release_tag:
        description: '직접 지정할 릴리즈 태그 (선택, 예: v1.2.3)'
        required: false
        type: string
      dry_run:
        description: '태그를 푸시하지 않고 계산만 확인'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  create-release-tag:
    uses: seorilabs/.github/.github/workflows/release-tag.yml@565fba53aa5053785c63c9b732b93a3fbd7be847
    with:
      target_ref: ${{ inputs.target_ref }}
      tag: ${{ inputs.release_tag }}
      bump: ${{ inputs.bump }}
      dry_run: ${{ inputs.dry_run }}

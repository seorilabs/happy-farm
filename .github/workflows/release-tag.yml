name: Create Release Tag

on:
  workflow_dispatch:
    inputs:
      bump:
        description: '다음 릴리즈 태그 증가 방식'
        required: true
        default: patch
        type: choice
        options:
          - minor
          - patch
          - major
      release_tag:
        description: '직접 지정할 릴리즈 태그 (선택, 예: v1.2.3)'
        required: false
        type: string
      dry_run:
        description: '태그를 푸시하지 않고 계산만 확인'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: happy-farm-release-tag
  cancel-in-progress: false

jobs:
  create-release-tag:
    name: Create release tag
    runs-on: seorilabs-rpi-arm64
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve next release tag
        id: release
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          args=(--github-output --github-step-summary)
          if [ -n "$RELEASE_TAG_INPUT" ]; then
            args+=(--tag "$RELEASE_TAG_INPUT")
          else
            args+=(--bump "$BUMP")
          fi

          node scripts/resolve-next-release-tag.mjs "${args[@]}"

      - name: Create and push tag
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
          BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          target_commit="$GITHUB_SHA"
          short_sha="$(git rev-parse --short "$target_commit")"

          # 릴리즈 경계 마커 커밋. GitHub /commits 화면은 태그를 표시하지 않아 커밋 목록만으로
          # 배포 경계를 알 수 없다. 트리가 부모와 동일한 빈 커밋을 남기고 그 커밋에 태그를 단다.
          # 백오피스 경로(pushReleaseMarkerCommit) / org 재사용 release-tag.yml 과 같은 규칙이다.
          # skip 지시어는 넣지 않는다 — 마커가 태그 커밋이 되므로 push:tags 배포까지 삼킨다.
          marker_prefix="chore(release): "
          remote_head="$(git ls-remote --heads origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          head_subject="$(git log -1 --format=%s "$target_commit")"

          if [ -n "$remote_head" ] && [ "$remote_head" = "$target_commit" ] \
             && [ "${head_subject#"$marker_prefix"}" = "$head_subject" ]; then
            git commit --allow-empty -q -m "${marker_prefix}${RELEASE_TAG}"
            if git push origin "HEAD:refs/heads/$GITHUB_REF_NAME" 2>/tmp/marker_err; then
              target_commit="$(git rev-parse HEAD)"
              short_sha="$(git rev-parse --short "$target_commit")"
              echo "Release marker commit pushed: $short_sha"
            else
              # 보호 브랜치/권한/경합으로 거절 → 마커 없이 원래 커밋에 태그를 단다.
              cat /tmp/marker_err >&2
              echo "Marker commit push rejected; tagging $short_sha directly."
              git reset --hard -q "$target_commit"
            fi
          fi

          git tag -a "$RELEASE_TAG" "$target_commit" -m "Happy Farm $RELEASE_TAG ($VERSION_NAME, build $BUILD_NUMBER)"
          git push origin "refs/tags/$RELEASE_TAG"

name: Deploy Drift Check

# 채널별 배포가 최신 릴리즈 태그를 따라잡고 있는지 매일 점검한다(#420).
# 최신 v태그와 각 채널(AIT·Google Play)의 최근 성공 배포 태그를 비교해,
# 태그 2개 이상 또는 72시간 이상 뒤처지면 step summary 경고 + 이슈로 알린다.
# iOS는 Xcode Cloud(GH Actions 밖) 경로라 표에만 명시하고 판정에서 제외한다.
on:
  schedule:
    # 매일 00:10 UTC(한국시간 09:10) — 정각 혼잡을 피해 10분 오프셋.
    - cron: '10 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: happy-farm-deploy-drift-check
  cancel-in-progress: false

jobs:
  drift-check:
    name: Check channel deploy drift
    runs-on: seorilabs-rpi-arm64
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Evaluate deploy drift
        uses: actions/github-script@v9
        with:
          script: |
            const path = require('path');
            const { run } = require(path.resolve(process.env.GITHUB_WORKSPACE, 'scripts/deploy-drift-run.js'));
            await run({ github, context, core, exec });

name: Deploy Google Play

# 서명 AAB 빌드와 업로드를 조직 공통 워크플로에 위임한다. 저장소가 public 으로 바뀌면서
# GitHub-hosted ubuntu-latest(4 vCPU / 16GB)가 무료로 열렸고, 그 전까지 분당 과금을 피하려고
# 쓰던 Cloud Build(기본 e2-standard-2, 2 vCPU)는 더 느리면서 과금까지 되는 경로가 됐다.
# 직전 실행 기준 Cloud Build 단계만 34~50분이 걸렸고, 그동안 ubuntu-latest 러너는 제출한
# 빌드를 기다리기만 했다.
#
# 이 파일은 얇은 호출부로만 둔다. 빌드·서명·AAB readback·업로드 계약은 중앙에 있다.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '빌드/업로드할 릴리즈 태그 (예: v1.1.0). 비우면 선택한 ref를 사용합니다.'
        required: false
        type: string
      send_to_google_play:
        description: 'AAB 빌드 후 Google Play 내부 테스트에 올림'
        required: false
        default: false
        type: boolean
      after_upload:
        description: '업로드 후 처리: 초안으로 둘지, 내부 테스터에게 보낼지'
        required: false
        default: '초안만 만들기'
        type: choice
        options:
          - 초안만 만들기
          - 내부 테스터에게 배포하기
      review_later_in_console:
        description: '검토 제출은 자동으로 하지 않고 Play Console에서 나중에 처리'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      release_tag:
        description: '빌드/업로드할 릴리즈 태그 (예: v1.1.0). 비우면 선택한 ref를 사용합니다.'
        required: false
        type: string
      send_to_google_play:
        description: 'AAB 빌드 후 Google Play 내부 테스트에 올림'
        required: false
        default: false
        type: boolean
      after_upload:
        description: '업로드 후 처리: "초안만 만들기" 또는 "내부 테스터에게 배포하기"'
        required: false
        default: '초안만 만들기'
        type: string
      review_later_in_console:
        description: '검토 제출은 자동으로 하지 않고 Play Console에서 나중에 처리'
        required: false
        default: false
        type: boolean
    # workflow_dispatch 로 직접 돌릴 때는 저장소 secret 이 그대로 보이지만, 호출될 때는
    # 여기에 선언한 것만 넘어온다. 선언이 없으면 caller 의 secrets 블록이 거부된다.
    secrets:
      FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64:
        required: false
      GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64:
        required: false
      GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD:
        required: false
      GOOGLE_PLAY_UPLOAD_KEY_PASSWORD:
        required: false

permissions:
  contents: read
  id-token: write
  packages: read

concurrency:
  group: happy-farm-google-play-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # 중앙 워크플로는 keystore 를 복원해 쓰기만 하고 그 키가 우리 업로드 키인지는 보지 않는다.
  # Cloud Build 경로의 build-android.sh 가 하던 지문 대조를 여기서 유지한다. 틀린 키로 서명한
  # AAB 는 Play 가 업로드 시점에 거부하지만, 40분짜리 빌드를 태우기 전에 끊는 편이 낫다.
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Cloud Build 단계가 하던 검사다. 광고 단위와 analytics 계약이 깨진 채로 스토어에
      # 올라가지 않도록 빌드 전에 막는다.
      - name: Check AdMob and Analytics contract
        run: node scripts/check-admob-analytics-contract.mjs

      - name: Compare keystore certificate against build.env
        shell: bash
        env:
          GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64 }}
          GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          GOOGLE_PLAY_UPLOAD_KEY_ALIAS: ${{ vars.GOOGLE_PLAY_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          [ -f build.env ] || { echo "build.env가 없습니다." >&2; exit 1; }
          # shellcheck disable=SC1091
          . ./build.env
          [ -n "${EXPECTED_UPLOAD_CERT_SHA256:-}" ] || {
            echo "build.env에 EXPECTED_UPLOAD_CERT_SHA256이 없습니다." >&2
            exit 1
          }
          [ -n "$GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64" ] || {
            echo "GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64이 비어 있습니다." >&2
            exit 1
          }

          keystore="$RUNNER_TEMP/upload-key.jks"
          printf '%s' "$GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"

          actual="$(keytool -list -v \
            -keystore "$keystore" \
            -alias "${GOOGLE_PLAY_UPLOAD_KEY_ALIAS:-upload}" \
            -storepass "$GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD" \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*\(.*\)$/\1/p' \
            | head -1 \
            | tr -d ': ')"

          [ -n "$actual" ] || { echo "keystore에서 SHA256 지문을 읽지 못했습니다." >&2; exit 1; }
          [ "$actual" = "$EXPECTED_UPLOAD_CERT_SHA256" ] || {
            # 지문 자체는 공개 식별자라 출력해도 비밀이 새지 않는다.
            echo "Google Play upload certificate fingerprint가 다릅니다." >&2
            echo "  expected=$EXPECTED_UPLOAD_CERT_SHA256" >&2
            echo "  actual  =$actual" >&2
            exit 1
          }
          echo "Google Play upload certificate 확인 완료"

  google-play:
    name: Deploy Google Play
    needs: preflight
    uses: seorilabs/.github/.github/workflows/rn-deploy-google-play.yml@main
    with:
      release_tag: ${{ inputs.release_tag }}
      package_name: com.seorilabs.happyfarm
      upload: ${{ inputs.send_to_google_play }}
      track: internal
      release_status: ${{ inputs.after_upload == '내부 테스터에게 배포하기' && 'completed' || 'draft' }}
      changes_not_sent_for_review: ${{ inputs.review_later_in_console }}
      package_manager: pnpm
      pnpm_version: '11.3.0'
      node_version: '24'
      java_version: '17'
      android_dir: apps/mobile/android
    secrets:
      FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
      GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64 }}
      GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
      GOOGLE_PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEY_PASSWORD }}

name: Deploy Google Play

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '빌드/업로드할 릴리즈 태그 (예: v1.1.0). 비우면 선택한 ref를 사용합니다.'
        required: false
        type: string
      send_to_google_play:
        description: 'AAB 빌드 후 Google Play 내부 테스트에 올림'
        required: false
        default: false
        type: boolean
      after_upload:
        description: '업로드 후 처리: 초안으로 둘지, 내부 테스터에게 보낼지'
        required: false
        default: '초안만 만들기'
        type: choice
        options:
          - 초안만 만들기
          - 내부 테스터에게 배포하기
      review_later_in_console:
        description: '검토 제출은 자동으로 하지 않고 Play Console에서 나중에 처리'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      release_tag:
        description: '빌드/업로드할 릴리즈 태그 (예: v1.1.0). 비우면 선택한 ref를 사용합니다.'
        required: false
        type: string
      send_to_google_play:
        description: 'AAB 빌드 후 Google Play 내부 테스트에 올림'
        required: false
        default: false
        type: boolean
      after_upload:
        description: '업로드 후 처리: "초안만 만들기" 또는 "내부 테스터에게 배포하기"'
        required: false
        default: '초안만 만들기'
        type: string
      review_later_in_console:
        description: '검토 제출은 자동으로 하지 않고 Play Console에서 나중에 처리'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  packages: read

concurrency:
  group: happy-farm-google-play-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-aab:
    name: Cloud Build signed Android App Bundle
    runs-on: seorilabs-rpi-arm64
    timeout-minutes: 75
    environment: google-play
    defaults:
      run:
        working-directory: release-source
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      release_tag: ${{ steps.release-version.outputs.release_tag }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
      tooling_sha: ${{ steps.meta.outputs.tooling_sha }}
      version_code: ${{ steps.release-version.outputs.google_play_version_code }}
      version_name: ${{ steps.release-version.outputs.version_name }}

    steps:
      - name: Checkout workflow tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: ci-tooling

      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
          path: release-source

      - name: Overlay current Cloud Build tooling
        shell: bash
        run: |
          set -euo pipefail
          cp ../ci-tooling/build.env build.env
          cp ../ci-tooling/cloudbuild-android.yaml cloudbuild-android.yaml
          cp ../ci-tooling/.gcloudignore .gcloudignore
          install -m 755 ../ci-tooling/scripts/build-android.sh scripts/build-android.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          check-latest: false
          cache: pnpm
          cache-dependency-path: release-source/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: '@seorilabs'

      - name: Resolve release version
        id: release-version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: GITHUB_SHA="$(git rev-parse HEAD)" node scripts/resolve-release-version.mjs --github-output --github-step-summary --write-release-info --quiet

      - name: Resolve build contract
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source build.env
          source_sha="$(git rev-parse HEAD)"
          tooling_sha="$(git -C ../ci-tooling rev-parse HEAD)"
          artifact_name="happy-farm-google-play-v${{ steps.release-version.outputs.version_name }}-code${{ steps.release-version.outputs.google_play_version_code }}-$source_sha"
          artifact_bucket="gs://seorilabs-ci-build-artifacts/${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.run_id }}-${{ github.run_attempt }}"
          {
            echo "source_sha=$source_sha"
            echo "tooling_sha=$tooling_sha"
            echo "artifact_name=$artifact_name"
            echo "artifact_bucket=$artifact_bucket"
            echo "aab_path=$AAB_PATH"
            echo "aab_name=$(basename "$AAB_PATH")"
            echo "builder=$ANDROID_BUILDER_IMAGE:$ANDROID_BUILDER_TAG"
            echo "pnpm_store=$CLOUD_BUILD_PNPM_STORE"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Workload Identity configuration
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL }}
          UPLOAD_ALIAS: ${{ vars.GOOGLE_PLAY_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          [ -n "$WIF_PROVIDER" ] || { echo "GOOGLE_WORKLOAD_IDENTITY_PROVIDER var가 없습니다." >&2; exit 1; }
          [ -n "$SERVICE_ACCOUNT" ] || { echo "GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL var가 없습니다." >&2; exit 1; }
          [ -n "$UPLOAD_ALIAS" ] || { echo "GOOGLE_PLAY_UPLOAD_KEY_ALIAS var가 없습니다." >&2; exit 1; }

      - name: Prepare private package seed store
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          PNPM_STORE_PATH: ${{ steps.meta.outputs.pnpm_store }}
        run: |
          set -euo pipefail
          private_package='@seorilabs/platform-sdk'
          private_version="$(node -e 'const p=require("./apps/mobile/package.json"); process.stdout.write(p.dependencies[process.argv[1]] ?? "")' "$private_package")"
          [ -n "$private_version" ] || { echo "$private_package dependency가 없습니다." >&2; exit 1; }
          pnpm store add "$private_package@$private_version" --store-dir "$PNPM_STORE_PATH"
          test -n "$(find "$PNPM_STORE_PATH" -mindepth 1 -maxdepth 1 -print -quit)"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token
          create_credentials_file: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: seorilabs-ci

      - name: Set quota project
        run: gcloud config set billing/quota_project seorilabs-ci

      - name: Build signed AAB on Cloud Build
        shell: bash
        env:
          ARTIFACT_BUCKET: ${{ steps.meta.outputs.artifact_bucket }}
          UPLOAD_ALIAS: ${{ vars.GOOGLE_PLAY_UPLOAD_KEY_ALIAS }}
          VERSION_CODE: ${{ steps.release-version.outputs.google_play_version_code }}
          VERSION_NAME: ${{ steps.release-version.outputs.version_name }}
        run: |
          set -euo pipefail
          gcloud builds submit . \
            --project=seorilabs-ci \
            --region=global \
            --config=cloudbuild-android.yaml \
            --ignore-file=.gcloudignore \
            --substitutions="_ANDROID_VERSION_NAME=$VERSION_NAME,_ANDROID_VERSION_CODE=$VERSION_CODE,_GOOGLE_PLAY_UPLOAD_KEY_ALIAS=$UPLOAD_ALIAS,_ARTIFACT_BUCKET=$ARTIFACT_BUCKET"

      - name: Fetch signed AAB
        shell: bash
        env:
          AAB_NAME: ${{ steps.meta.outputs.aab_name }}
          AAB_PATH: ${{ steps.meta.outputs.aab_path }}
          ARTIFACT_BUCKET: ${{ steps.meta.outputs.artifact_bucket }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$AAB_PATH")"
          gcloud storage cp "$ARTIFACT_BUCKET/$AAB_NAME" "$AAB_PATH"
          test -s "$AAB_PATH"

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: release-source/${{ steps.meta.outputs.aab_path }}
          if-no-files-found: error
          retention-days: 3

      - name: Build summary
        shell: bash
        env:
          AAB_PATH: ${{ steps.meta.outputs.aab_path }}
        run: |
          {
            echo "### Happy Farm Android Cloud Build 후보"
            echo "- source: \`${{ steps.meta.outputs.source_sha }}\`"
            echo "- tooling: \`${{ steps.meta.outputs.tooling_sha }}\`"
            echo "- release: \`${{ steps.release-version.outputs.release_tag }}\`"
            echo "- versionCode: \`${{ steps.release-version.outputs.google_play_version_code }}\`"
            echo "- builder: \`${{ steps.meta.outputs.builder }}\`"
            echo "- bytes: \`$(wc -c < "$AAB_PATH" | tr -d ' ')\`"
            echo "- Google Play upload: \`${{ inputs.send_to_google_play }}\`"
            echo "- production promotion: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"

  upload:
    name: Upload AAB to Google Play internal track
    if: ${{ inputs.send_to_google_play }}
    needs: build-aab
    runs-on: seorilabs-rpi-arm64
    timeout-minutes: 25
    environment: google-play

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build-aab.outputs.release_tag }}

      - name: Download signed AAB
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-aab.outputs.artifact_name }}
          path: artifacts/android

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: arm64

      - name: Install Google Play API client
        run: >-
          python3 -m pip install --disable-pip-version-check
          google-api-python-client google-auth google-auth-httplib2 httplib2

      - name: Validate Google Play version code
        shell: bash
        env:
          VERSION_CODE: ${{ needs.build-aab.outputs.version_code }}
        run: |
          set -euo pipefail
          next_play_version_code="$(python3 scripts/upload-google-play-internal.py --print-next-version-code)"
          if [ "$VERSION_CODE" -lt "$next_play_version_code" ]; then
            echo "Release tag versionCode $VERSION_CODE is lower than the next available Google Play versionCode $next_play_version_code." >&2
            exit 1
          fi

      - name: Upload AAB to Google Play internal track
        shell: bash
        env:
          AFTER_UPLOAD: ${{ inputs.after_upload }}
          REVIEW_LATER_IN_CONSOLE: ${{ inputs.review_later_in_console }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-aab.outputs.release_tag }}
        run: |
          set -euo pipefail

          case "$AFTER_UPLOAD" in
            "초안만 만들기")
              release_status="draft"
              ;;
            "내부 테스터에게 배포하기")
              release_status="completed"
              ;;
            *)
              echo "Unsupported after_upload input: $AFTER_UPLOAD" >&2
              exit 1
              ;;
          esac

          mapfile -t aabs < <(find artifacts/android -type f -name '*.aab' -print)
          [ "${#aabs[@]}" -eq 1 ] || {
            echo "정확히 하나의 AAB가 필요합니다: ${#aabs[@]}" >&2
            exit 1
          }

          args=(--aab-path "${aabs[0]}" --release-status "$release_status")
          if [ "$REVIEW_LATER_IN_CONSOLE" = "true" ]; then
            args+=(--changes-not-sent-for-review)
          fi

          notes="$RUNNER_TEMP/release-notes.json"
          if [ -n "$TAG" ] && gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern release-notes.json --output "$notes" --clobber 2>/dev/null \
            && [ "$(jq -r '(.notes // {}) | length' "$notes")" -gt 0 ]; then
            args+=(--release-notes-json "$notes")
            echo "release-notes.json 로드: $(jq -r '.notes | keys_unsorted | join(", ")' "$notes")"
          fi

          python3 scripts/upload-google-play-internal.py "${args[@]}"

      - name: Upload summary
        shell: bash
        run: |
          {
            echo "### Google Play internal 업로드"
            echo "- source: \`${{ needs.build-aab.outputs.source_sha }}\`"
            echo "- tooling: \`${{ needs.build-aab.outputs.tooling_sha }}\`"
            echo "- release: \`${{ needs.build-aab.outputs.release_tag }}\`"
            echo "- versionCode: \`${{ needs.build-aab.outputs.version_code }}\`"
            echo "- track: \`internal\`"
            echo "- production promotion: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"

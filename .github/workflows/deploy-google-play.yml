name: Deploy Google Play

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '빌드/업로드할 릴리즈 태그 (예: v1.1.0). 비우면 선택한 ref를 사용합니다.'
        required: false
        type: string
      send_to_google_play:
        description: 'AAB 빌드 후 Google Play 내부 테스트에 올림'
        required: false
        default: false
        type: boolean
      after_upload:
        description: '업로드 후 처리: 초안으로 둘지, 내부 테스터에게 보낼지'
        required: false
        default: '초안만 만들기'
        type: choice
        options:
          - 초안만 만들기
          - 내부 테스터에게 배포하기
      review_later_in_console:
        description: '검토 제출은 자동으로 하지 않고 Play Console에서 나중에 처리'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      release_tag:
        description: '빌드/업로드할 릴리즈 태그 (예: v1.1.0). 비우면 선택한 ref를 사용합니다.'
        required: false
        type: string
      send_to_google_play:
        description: 'AAB 빌드 후 Google Play 내부 테스트에 올림'
        required: false
        default: false
        type: boolean
      after_upload:
        description: '업로드 후 처리: "초안만 만들기" 또는 "내부 테스터에게 배포하기"'
        required: false
        default: '초안만 만들기'
        type: string
      review_later_in_console:
        description: '검토 제출은 자동으로 하지 않고 Play Console에서 나중에 처리'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  packages: read

concurrency:
  group: happy-farm-google-play-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Bind exact release tag
    uses: seorilabs/.github/.github/workflows/resolve-release-version.yml@700348a9511b5ea202291ee1e1de4f73335783e0
    with:
      release_tag: ${{ inputs.release_tag }}

  build-aab:
    name: Cloud Build signed Android App Bundle
    needs: resolve
    runs-on: seorilabs-rpi-arm64
    timeout-minutes: 75
    environment: google-play
    defaults:
      run:
        working-directory: release-source
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      artifact_digest: ${{ steps.provenance.outputs.artifact_digest }}
      package_name: ${{ steps.provenance.outputs.package_name }}
      release_tag: ${{ needs.resolve.outputs.tag }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
      version_code: ${{ needs.resolve.outputs.android_version_code }}
      version_name: ${{ needs.resolve.outputs.version_name }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          path: release-source

      - name: Checkout exact release authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: seorilabs/.github
          ref: 700348a9511b5ea202291ee1e1de4f73335783e0
          path: .seorilabs-release-authority
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          check-latest: false
          cache: pnpm
          cache-dependency-path: release-source/pnpm-lock.yaml

      - name: Project central release binding into runtime metadata
        env:
          SEORI_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          SEORI_RELEASE_VERSION: ${{ needs.resolve.outputs.version_name }}
          SEORI_RELEASE_VERSION_CODE: ${{ needs.resolve.outputs.android_version_code }}
          SEORI_RELEASE_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SEORI_RELEASE_SOURCE_SHA"
          node scripts/write-release-info.mjs

      - name: Check AdMob and Analytics contract
        run: node scripts/check-admob-analytics-contract.mjs

      - name: Resolve build contract
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source build.env
          source_sha="$(git rev-parse HEAD)"
          artifact_name="happy-farm-google-play-v${{ needs.resolve.outputs.version_name }}-code${{ needs.resolve.outputs.android_version_code }}-$source_sha"
          artifact_bucket="gs://seorilabs-ci-build-artifacts/${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.run_id }}-${{ github.run_attempt }}"
          {
            echo "source_sha=$source_sha"
            echo "artifact_name=$artifact_name"
            echo "artifact_bucket=$artifact_bucket"
            echo "aab_path=$AAB_PATH"
            echo "aab_name=$(basename "$AAB_PATH")"
            echo "builder=$ANDROID_BUILDER_IMAGE:$ANDROID_BUILDER_TAG"
            echo "pnpm_store=$CLOUD_BUILD_PNPM_STORE"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Workload Identity configuration
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL }}
          UPLOAD_ALIAS: ${{ vars.GOOGLE_PLAY_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          [ -n "$WIF_PROVIDER" ] || { echo "GOOGLE_WORKLOAD_IDENTITY_PROVIDER var가 없습니다." >&2; exit 1; }
          [ -n "$SERVICE_ACCOUNT" ] || { echo "GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL var가 없습니다." >&2; exit 1; }
          [ -n "$UPLOAD_ALIAS" ] || { echo "GOOGLE_PLAY_UPLOAD_KEY_ALIAS var가 없습니다." >&2; exit 1; }

      - name: Prepare private package seed store
        shell: bash
        env:
          PNPM_STORE_PATH: ${{ steps.meta.outputs.pnpm_store }}
        run: |
          set -euo pipefail
          private_package='@seorilabs/platform-sdk'
          private_version="$(node -e 'const p=require("./apps/mobile/package.json"); process.stdout.write(p.dependencies[process.argv[1]] ?? "")' "$private_package")"
          [ -n "$private_version" ] || { echo "$private_package dependency가 없습니다." >&2; exit 1; }
          pnpm store add "$private_package@$private_version" --store-dir "$PNPM_STORE_PATH"
          test -n "$(find "$PNPM_STORE_PATH" -mindepth 1 -maxdepth 1 -print -quit)"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token
          create_credentials_file: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: seorilabs-ci

      - name: Set quota project
        run: gcloud config set billing/quota_project seorilabs-ci

      - name: Build signed AAB on Cloud Build
        shell: bash
        env:
          ARTIFACT_BUCKET: ${{ steps.meta.outputs.artifact_bucket }}
          UPLOAD_ALIAS: ${{ vars.GOOGLE_PLAY_UPLOAD_KEY_ALIAS }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          VERSION_CODE: ${{ needs.resolve.outputs.android_version_code }}
          VERSION_NAME: ${{ needs.resolve.outputs.version_name }}
        run: |
          set -euo pipefail
          gcloud builds submit . \
            --project=seorilabs-ci \
            --region=global \
            --config=cloudbuild-android.yaml \
            --ignore-file=.gcloudignore \
            --substitutions="_SEORI_RELEASE_TAG=$RELEASE_TAG,_SEORI_RELEASE_SOURCE_SHA=$SOURCE_SHA,_ANDROID_VERSION_NAME=$VERSION_NAME,_ANDROID_VERSION_CODE=$VERSION_CODE,_GOOGLE_PLAY_UPLOAD_KEY_ALIAS=$UPLOAD_ALIAS,_ARTIFACT_BUCKET=$ARTIFACT_BUCKET"

      - name: Fetch signed AAB
        shell: bash
        env:
          AAB_NAME: ${{ steps.meta.outputs.aab_name }}
          AAB_PATH: ${{ steps.meta.outputs.aab_path }}
          ARTIFACT_BUCKET: ${{ steps.meta.outputs.artifact_bucket }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$AAB_PATH")"
          gcloud storage cp "$ARTIFACT_BUCKET/$AAB_NAME" "$AAB_PATH"
          test -s "$AAB_PATH"

      - name: Verify AAB against the central release binding
        id: provenance
        shell: bash
        env:
          AAB_PATH: ${{ steps.meta.outputs.aab_path }}
          RELEASE_BINDING_BASE64: ${{ needs.resolve.outputs.binding_base64 }}
        run: |
          set -euo pipefail
          binding="$RUNNER_TEMP/release-binding.json"
          printf '%s' "$RELEASE_BINDING_BASE64" | base64 --decode > "$binding"
          unzip -p "$AAB_PATH" base/manifest/AndroidManifest.xml > "$RUNNER_TEMP/aab-manifest.pb"
          test -s "$RUNNER_TEMP/aab-manifest.pb"
          RELEASE_BINDING_PATH="$binding" \
            node ../.seorilabs-release-authority/scripts/release/verify-release-artifact.mjs \
              --kind android-app-bundle \
              --artifact "$AAB_PATH" \
              --metadata "$RUNNER_TEMP/aab-manifest.pb" \
              --receipt "$RUNNER_TEMP/release-artifact-receipt.txt" \
              --github-output

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: release-source/${{ steps.meta.outputs.aab_path }}
          if-no-files-found: error
          retention-days: 3

      - name: Build summary
        shell: bash
        env:
          AAB_PATH: ${{ steps.meta.outputs.aab_path }}
        run: |
          {
            echo "### Happy Farm Android Cloud Build 후보"
            echo "- source: \`${{ steps.meta.outputs.source_sha }}\`"
            echo "- release: \`${{ needs.resolve.outputs.tag }}\`"
            echo "- versionCode: \`${{ needs.resolve.outputs.android_version_code }}\`"
            echo "- builder: \`${{ steps.meta.outputs.builder }}\`"
            echo "- bytes: \`$(wc -c < "$AAB_PATH" | tr -d ' ')\`"
            echo "- Google Play upload: \`${{ inputs.send_to_google_play }}\`"
            echo "- production promotion: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"

  upload:
    name: Upload AAB to Google Play internal track
    if: ${{ inputs.send_to_google_play }}
    needs: build-aab
    runs-on: seorilabs-rpi-arm64
    timeout-minutes: 25
    environment: google-play

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-aab.outputs.release_tag }}

      - name: Checkout exact release authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: seorilabs/.github
          ref: 700348a9511b5ea202291ee1e1de4f73335783e0
          path: .seorilabs-release-authority
          persist-credentials: false

      - name: Download signed AAB
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-aab.outputs.artifact_name }}
          path: artifacts/android

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          architecture: arm64

      - name: Install Google Play API client
        run: >-
          python3 -m pip install --disable-pip-version-check
          google-api-python-client google-auth google-auth-httplib2 httplib2

      - name: Validate Google Play version code
        shell: bash
        env:
          VERSION_CODE: ${{ needs.build-aab.outputs.version_code }}
        run: |
          set -euo pipefail
          next_play_version_code="$(python3 scripts/upload-google-play-internal.py --print-next-version-code)"
          if [ "$VERSION_CODE" -lt "$next_play_version_code" ]; then
            echo "Release tag versionCode $VERSION_CODE is lower than the next available Google Play versionCode $next_play_version_code." >&2
            exit 1
          fi

      - name: Upload AAB to Google Play internal track
        shell: bash
        env:
          AFTER_UPLOAD: ${{ inputs.after_upload }}
          REVIEW_LATER_IN_CONSOLE: ${{ inputs.review_later_in_console }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-aab.outputs.release_tag }}
          VERSION_NAME: ${{ needs.build-aab.outputs.version_name }}
          VERIFIED_PACKAGE_NAME: ${{ needs.build-aab.outputs.package_name }}
          SEORI_EXPECTED_AAB_SHA256: ${{ needs.build-aab.outputs.artifact_digest }}
          SEORI_EXPECTED_ANDROID_VERSION_CODE: ${{ needs.build-aab.outputs.version_code }}
        run: |
          set -euo pipefail

          case "$AFTER_UPLOAD" in
            "초안만 만들기")
              release_status="draft"
              ;;
            "내부 테스터에게 배포하기")
              release_status="completed"
              ;;
            *)
              echo "Unsupported after_upload input: $AFTER_UPLOAD" >&2
              exit 1
              ;;
          esac

          mapfile -t aabs < <(find artifacts/android -type f -name '*.aab' -print)
          [ "${#aabs[@]}" -eq 1 ] || {
            echo "정확히 하나의 AAB가 필요합니다: ${#aabs[@]}" >&2
            exit 1
          }
          [ "$VERIFIED_PACKAGE_NAME" = "com.seorilabs.happyfarm" ] || {
            echo "검증된 AAB package identity가 Backoffice BuildTarget과 다릅니다." >&2
            exit 1
          }

          args=(
            --package-name "$VERIFIED_PACKAGE_NAME"
            --aab-path "${aabs[0]}"
            --expected-aab-sha256 "$SEORI_EXPECTED_AAB_SHA256"
            --expected-version-code "$SEORI_EXPECTED_ANDROID_VERSION_CODE"
            --track internal
            --release-name "$VERSION_NAME"
            --release-status "$release_status"
          )
          if [ "$REVIEW_LATER_IN_CONSOLE" = "true" ]; then
            args+=(--changes-not-sent-for-review)
          fi

          notes="$RUNNER_TEMP/release-notes.json"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern release-notes.json --output "$notes" --clobber
          [ "$(jq -r '(.notes // {}) | length' "$notes")" -gt 0 ] || {
            echo "release-notes.json이 없거나 비어 있습니다: $TAG" >&2
            exit 1
          }
          args+=(--release-notes-json "$notes")
          echo "release-notes.json 로드: $(jq -r '.notes | keys_unsorted | join(", ")' "$notes")"

          python3 .seorilabs-release-authority/scripts/release/upload-google-play-aab.py "${args[@]}"

      - name: Upload summary
        shell: bash
        run: |
          {
            echo "### Google Play internal 업로드"
            echo "- source: \`${{ needs.build-aab.outputs.source_sha }}\`"
            echo "- release: \`${{ needs.build-aab.outputs.release_tag }}\`"
            echo "- versionCode: \`${{ needs.build-aab.outputs.version_code }}\`"
            echo "- track: \`internal\`"
            echo "- production promotion: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"

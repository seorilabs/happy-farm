name: Deploy Google Play

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '빌드/업로드할 릴리즈 태그 (예: v1.1.0). 비우면 선택한 ref를 사용합니다.'
        required: false
        type: string
      send_to_google_play:
        description: 'AAB 빌드 후 Google Play 내부 테스트에 올림'
        required: false
        default: false
        type: boolean
      after_upload:
        description: '업로드 후 처리: 초안으로 둘지, 내부 테스터에게 보낼지'
        required: false
        default: '초안만 만들기'
        type: choice
        options:
          - 초안만 만들기
          - 내부 테스터에게 배포하기
      review_later_in_console:
        description: '검토 제출은 자동으로 하지 않고 Play Console에서 나중에 처리'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      release_tag:
        description: '빌드/업로드할 릴리즈 태그 (예: v1.1.0). 비우면 선택한 ref를 사용합니다.'
        required: false
        type: string
      send_to_google_play:
        description: 'AAB 빌드 후 Google Play 내부 테스트에 올림'
        required: false
        default: false
        type: boolean
      after_upload:
        description: '업로드 후 처리: "초안만 만들기" 또는 "내부 테스터에게 배포하기"'
        required: false
        default: '초안만 만들기'
        type: string
      review_later_in_console:
        description: '검토 제출은 자동으로 하지 않고 Play Console에서 나중에 처리'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: happy-farm-google-play-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-aab:
    name: Signed Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: google-play
    env:
      SHOULD_UPLOAD_TO_GOOGLE_PLAY: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.send_to_google_play) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup-pnpm-workspace

      - name: Resolve release version
        id: release-version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/resolve-release-version.mjs --github-output --github-step-summary --write-release-info --quiet

      - name: Setup Android build
        uses: ./.github/actions/setup-android-build

      - name: Typecheck mobile app
        run: pnpm --dir apps/mobile typecheck

      - name: Test mobile app
        run: pnpm --dir apps/mobile test --watchAll=false

      - name: Validate signing secrets
        shell: bash
        env:
          GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64 }}
          GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64 secret is required." >&2
            exit 1
          fi

          if [ -z "$GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD" ]; then
            echo "GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD secret is required." >&2
            exit 1
          fi

      - name: Restore Google Play upload keystore
        shell: bash
        env:
          GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64 }}
          GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          GOOGLE_PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEY_PASSWORD }}
          GOOGLE_PLAY_UPLOAD_KEY_ALIAS: ${{ vars.GOOGLE_PLAY_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail

          signing_dir="$RUNNER_TEMP/happy-farm-signing"
          keystore_path="$signing_dir/happy-farm-upload-key.jks"
          key_alias="${GOOGLE_PLAY_UPLOAD_KEY_ALIAS:-happy-farm-upload}"
          key_password="${GOOGLE_PLAY_UPLOAD_KEY_PASSWORD:-$GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD}"

          mkdir -p "$signing_dir"
          printf '%s' "$GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"

          {
            printf 'storeFile=%s\n' "$keystore_path"
            printf 'storePassword=%s\n' "$GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$key_alias"
            printf 'keyPassword=%s\n' "$key_password"
          } > apps/mobile/android/key.properties
          chmod 600 apps/mobile/android/key.properties

      - name: Restore Firebase Android config
        shell: bash
        env:
          FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 is not set; building without Firebase Android config."
            exit 0
          fi

          printf '%s' "$FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > apps/mobile/android/app/google-services.json
          node scripts/check-firebase-android-config.mjs

      - name: Validate Google Play WIF config
        if: env.SHOULD_UPLOAD_TO_GOOGLE_PLAY == 'true'
        shell: bash
        env:
          GOOGLE_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL }}
        run: |
          set -euo pipefail

          if [ -z "$GOOGLE_WORKLOAD_IDENTITY_PROVIDER" ]; then
            echo "GOOGLE_WORKLOAD_IDENTITY_PROVIDER repository variable is required to upload to Google Play." >&2
            exit 1
          fi

          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL" ]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL repository variable is required to upload to Google Play." >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        if: env.SHOULD_UPLOAD_TO_GOOGLE_PLAY == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true

      - name: Install Google Play API client
        if: env.SHOULD_UPLOAD_TO_GOOGLE_PLAY == 'true'
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install google-api-python-client google-auth

      - name: Validate Google Play version code
        id: play-version
        shell: bash
        env:
          GOOGLE_PLAY_VERSION_CODE: ${{ steps.release-version.outputs.google_play_version_code }}
        run: |
          set -euo pipefail

          version_code="$GOOGLE_PLAY_VERSION_CODE"
          if [ "$SHOULD_UPLOAD_TO_GOOGLE_PLAY" = "true" ]; then
            next_play_version_code="$(python3 scripts/upload-google-play-internal.py --print-next-version-code)"
            if [ "$version_code" -lt "$next_play_version_code" ]; then
              echo "Release tag versionCode $version_code is lower than the next available Google Play versionCode $next_play_version_code." >&2
              exit 1
            fi
          fi

          if ! [[ "$version_code" =~ ^[0-9]+$ ]]; then
            echo "Resolved versionCode must be a positive integer, got: $version_code" >&2
            exit 1
          fi

          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "versionCode=$version_code" >> "$GITHUB_STEP_SUMMARY"
          echo "versionCodeSource=Release tag buildNumber" >> "$GITHUB_STEP_SUMMARY"

      - name: Build signed Android AAB
        working-directory: apps/mobile/android
        env:
          GOOGLE_PLAY_VERSION_CODE: ${{ steps.play-version.outputs.version_code }}
          GOOGLE_PLAY_VERSION_NAME: ${{ steps.release-version.outputs.version_name }}
        run: ./gradlew :app:bundleRelease --no-daemon -PversionCodeOverride="$GOOGLE_PLAY_VERSION_CODE" -PversionNameOverride="$GOOGLE_PLAY_VERSION_NAME"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: happy-farm-google-play-v${{ steps.release-version.outputs.version_name }}-code${{ steps.play-version.outputs.version_code }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 5
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload AAB to Google Play internal track
        if: env.SHOULD_UPLOAD_TO_GOOGLE_PLAY == 'true'
        shell: bash
        env:
          AFTER_UPLOAD: ${{ github.event_name == 'push' && '초안만 만들기' || inputs.after_upload }}
          REVIEW_LATER_IN_CONSOLE: ${{ github.event_name == 'workflow_dispatch' && inputs.review_later_in_console || false }}
        run: |
          set -euo pipefail

          case "$AFTER_UPLOAD" in
            "초안만 만들기")
              release_status="draft"
              ;;
            "내부 테스터에게 배포하기")
              release_status="completed"
              ;;
            *)
              echo "Unsupported after_upload input: $AFTER_UPLOAD" >&2
              exit 1
              ;;
          esac

          args=(--release-status "$release_status")
          if [ "$REVIEW_LATER_IN_CONSOLE" = "true" ]; then
            args+=(--changes-not-sent-for-review)
          fi

          python3 scripts/upload-google-play-internal.py "${args[@]}"

      - name: Print remaining Google Play readiness blockers
        continue-on-error: true
        run: pnpm check:play -- --json

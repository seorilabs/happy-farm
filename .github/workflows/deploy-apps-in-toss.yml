name: Deploy AppsInToss

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '배포할 릴리즈 태그 (예: v1.1.0). 비우면 선택한 ref를 사용합니다.'
        required: false
        type: string
      memo:
        description: '앱인토스 배포 메모 (선택, 최대 1000자)'
        required: false
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: '배포할 릴리즈 태그 (예: v1.1.0). 비우면 선택한 ref를 사용합니다.'
        required: false
        type: string
      memo:
        description: '앱인토스 배포 메모 (선택, 최대 1000자)'
        required: false
        type: string
    secrets:
      APPS_IN_TOSS_API_KEY:
        required: true
      GA4_MP_API_SECRET:
        required: false

permissions:
  contents: read
  packages: read

concurrency:
  group: happy-farm-apps-in-toss-deploy-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: AIT artifact deploy
    runs-on: seorilabs-rpi-arm64
    timeout-minutes: 25
    environment: apps-in-toss

    env:
      APPS_IN_TOSS_API_KEY: ${{ secrets.APPS_IN_TOSS_API_KEY }}
      APPS_IN_TOSS_INPUT_MEMO: ${{ github.event_name == 'workflow_dispatch' && inputs.memo || '' }}
      APPS_IN_TOSS_RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      GA4_MP_API_SECRET: ${{ secrets.GA4_MP_API_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

      - name: Check required config
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$APPS_IN_TOSS_API_KEY" ]; then
            echo "APPS_IN_TOSS_API_KEY secret is required." >&2
            exit 1
          fi

          if [ -z "$APPS_IN_TOSS_RELEASE_REF" ]; then
            echo "release_tag input or release tag ref is required." >&2
            exit 1
          fi

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup-pnpm-workspace
        with:
          install-command: pnpm --filter . --filter @happy-farm/ait... install --frozen-lockfile

      - name: Resolve release version
        id: release-version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: node scripts/resolve-release-version.mjs --github-output --github-step-summary --write-release-info --quiet

      - name: Lint
        run: pnpm --dir apps/ait lint

      - name: Typecheck
        run: pnpm --dir apps/ait typecheck

      - name: Test shared core
        run: pnpm check:core

      - name: Test AIT app
        run: pnpm --dir apps/ait test

      - name: Inject GA4 Measurement Protocol secret
        run: node scripts/write-ait-mp-config.mjs

      - name: Build AIT artifact
        run: pnpm --dir apps/ait build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: happy-farm-ait-v${{ steps.release-version.outputs.version_name }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: 'apps/ait/*.ait'

      - name: Deploy to Apps in Toss
        shell: bash
        env:
          RELEASE_VERSION_NAME: ${{ steps.release-version.outputs.version_name }}
        run: |
          set -euo pipefail

          memo="$APPS_IN_TOSS_INPUT_MEMO"

          if [ -z "$memo" ]; then
            source_sha="$(git rev-parse --short HEAD)"
            memo="v${RELEASE_VERSION_NAME} GitHub Actions ${APPS_IN_TOSS_RELEASE_REF}@${source_sha}"
          else
            memo="v${RELEASE_VERSION_NAME} ${memo}"
          fi

          pnpm --dir apps/ait run deploy --api-key "$APPS_IN_TOSS_API_KEY" --memo "$memo"

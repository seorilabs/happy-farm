name: Deploy AppsInToss

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '배포할 릴리즈 태그 (예: v1.1.0). 비우면 선택한 ref를 사용합니다.'
        required: false
        type: string
      memo:
        description: 'canonical memo 뒤에 붙일 운영 메모 (선택)'
        required: false
        type: string
      upload:
        description: 'false면 검증과 빌드만 수행합니다.'
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      release_tag:
        description: '배포할 릴리즈 태그 (예: v1.1.0). 비우면 선택한 ref를 사용합니다.'
        required: false
        type: string
      memo:
        description: 'canonical memo 뒤에 붙일 운영 메모 (선택)'
        required: false
        type: string
      upload:
        description: 'false면 검증과 빌드만 수행합니다.'
        required: false
        default: true
        type: boolean
    secrets:
      APPS_IN_TOSS_API_KEY:
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: happy-farm-apps-in-toss-deploy-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: AIT artifact deploy
    uses: seorilabs/.github/.github/workflows/rn-deploy-ait.yml@main
    with:
      release_tag: ${{ inputs.release_tag }}
      memo: ${{ inputs.memo }}
      upload: ${{ inputs.upload }}
      ait_dir: apps/ait
      package_manager: pnpm
      pnpm_version: '11.3.0'
      node_version: '24.16.0'
      install_command: pnpm --filter . --filter @happy-farm/ait... install --frozen-lockfile
      build_command: |
        node scripts/write-release-info.mjs
        pnpm --dir apps/ait lint
        pnpm --dir apps/ait typecheck
        pnpm check:core
        pnpm --dir apps/ait test
        pnpm check:admob-analytics
        pnpm --dir apps/ait build
      artifact_path: apps/ait/*.ait
    secrets:
      APPS_IN_TOSS_API_KEY: ${{ secrets.APPS_IN_TOSS_API_KEY }}

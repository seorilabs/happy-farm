name: Validate

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.wav'
      - '**.gitkeep'
      - 'assets/**'
      - 'docs/**'
      - 'play-store/**'
      - '.github/workflows/deploy-*.yml'
  push:
    branches-ignore:
      - main
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.wav'
      - '**.gitkeep'
      - 'assets/**'
      - 'docs/**'
      - 'play-store/**'
      - '.github/workflows/deploy-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: happy-farm-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Workspace checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup-pnpm-workspace

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test shared core and AIT app
        run: pnpm test

      - name: Typecheck mobile app
        run: pnpm --dir apps/mobile typecheck

      - name: Test mobile app
        run: pnpm --dir apps/mobile test --watchAll=false

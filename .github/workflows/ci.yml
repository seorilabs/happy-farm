name: Validate

on:
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.wav'
      - '**.gitkeep'
      - 'assets/**'
      - 'docs/**'
      - 'play-store/assets/**'
      - 'play-store/screenshots/**'
      - '.github/workflows/deploy-*.yml'
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.wav'
      - '**.gitkeep'
      - 'assets/**'
      - 'docs/**'
      - 'play-store/assets/**'
      - 'play-store/screenshots/**'
      - '.github/workflows/deploy-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: happy-farm-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-checks:
    name: PR lint and tests
    if: github.event_name == 'pull_request'
    runs-on: seorilabs-rpi-arm64
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup lightweight pnpm workspace
        uses: ./.github/actions/setup-pnpm-workspace
        with:
          install-command: pnpm --filter . --filter @happy-farm/ait... install --frozen-lockfile

      - name: Lint AIT and shared core
        run: pnpm --dir apps/ait lint

      - name: Test shared core
        run: pnpm check:core

      - name: Test AIT app
        run: pnpm --dir apps/ait test

  validate:
    name: Workspace checks
    if: github.event_name != 'pull_request'
    runs-on: seorilabs-rpi-arm64
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup-pnpm-workspace

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test shared core and AIT app
        run: pnpm test

      - name: Check i18n coverage
        run: pnpm check:i18n

      - name: Typecheck mobile app
        run: pnpm --dir apps/mobile typecheck

      - name: Test mobile app
        run: pnpm --dir apps/mobile test --watchAll=false

name: Validate

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.wav'
      - '**.gitkeep'
      - 'assets/**'
      - 'docs/**'
      - 'play-store/**'
      - '.github/workflows/deploy-*.yml'
  push:
    branches-ignore:
      - main
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.wav'
      - '**.gitkeep'
      - 'assets/**'
      - 'docs/**'
      - 'play-store/**'
      - '.github/workflows/deploy-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: happy-farm-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: AIT workspace checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup-pnpm-workspace

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build AIT artifact
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: happy-farm-ait-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: 'apps/ait/*.ait'

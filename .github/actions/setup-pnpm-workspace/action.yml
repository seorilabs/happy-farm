name: Setup pnpm workspace
description: Install the pinned Node/pnpm toolchain and workspace dependencies.

inputs:
  install-command:
    description: Dependency install command to run after Node and pnpm are ready.
    required: false
    default: pnpm install --frozen-lockfile

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11.3.0
        run_install: false

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 24.16.0
        check-latest: false
        cache: pnpm
        registry-url: https://npm.pkg.github.com
        scope: '@seorilabs'

    - name: Install dependencies
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
      run: ${{ inputs.install-command }}

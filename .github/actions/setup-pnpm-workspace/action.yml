name: Setup pnpm workspace
description: Install the pinned Node/pnpm toolchain and workspace dependencies.

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11.3.0
        run_install: false

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24.16.0
        check-latest: false
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
